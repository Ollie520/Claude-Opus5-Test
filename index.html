<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotating Sphere</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #04060c; overflow: hidden;
    overscroll-behavior: none;                 /* no rubber-banding behind the canvas */
  }
  body {
    font: 500 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #8c9ab4;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  /* Controls sit above the home indicator on phones. */
  #ui {
    position: fixed; left: 0; right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid rgba(150, 180, 220, .22);
    background: rgba(12, 20, 36, .55);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #cfe0f5; cursor: pointer;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    transition: background .2s ease, border-color .2s ease, transform .12s ease;
  }
  .btn:hover { background: rgba(20, 32, 54, .78); border-color: rgba(150, 180, 220, .38); }
  .btn:active { transform: scale(.93); }
  .btn:focus-visible { outline: 2px solid #6ea8ff; outline-offset: 3px; }
  .btn svg { width: 17px; height: 17px; fill: currentColor; display: block; }
  .ico-play { display: none; }
  .btn.paused .ico-play  { display: block; }
  .btn.paused .ico-pause { display: none; }

  #hint {
    color: rgba(190, 205, 230, .45); letter-spacing: .06em; text-transform: uppercase;
    font-size: 11px; text-align: center; padding: 0 18px;
    pointer-events: none; user-select: none;
    transition: opacity .6s ease; opacity: 1;
  }
  #hint.hidden { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    padding: 24px; color: #9fb0c8; line-height: 1.7;
  }
  #fallback.show { display: grid; }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>
  <div id="ui">
    <button id="toggle" class="btn" type="button" aria-label="Pause rotation" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="ico-pause" d="M9 5h3.2v14H9zM15.8 5H19v14h-3.2z"/>
        <path class="ico-play" d="M9 5l10 7-10 7z"/>
      </svg>
    </button>
    <div id="hint">drag to orbit &middot; scroll to zoom &middot; space to pause</div>
  </div>
  <div id="fallback"><div>
    <strong>WebGL unavailable</strong><br>
    This sphere is rendered on the GPU and needs WebGL, which this browser or device has disabled.
  </div></div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;    // drawing buffer size in px
uniform float uPhase;  // sphere spin, radians
uniform float uTilt;   // axial tilt, radians
uniform float uYaw;    // camera orbit
uniform float uPitch;  // camera elevation
uniform float uDist;   // camera distance from origin

#define PI 3.14159265359
#define R  1.0         // sphere radius

/* ---- rotations (GLSL mat3 constructors are column-major) ---- */
mat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1.0, 0.0, 0.0,  0.0, c, s,  0.0, -s, c); }
mat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s,  0.0, 1.0, 0.0,  s, 0.0, c); }
mat3 rotZ(float a) { float c = cos(a), s = sin(a); return mat3(c, s, 0.0,  -s, c, 0.0,  0.0, 0.0, 1.0); }

/* ---- value noise ---- */
float hash1(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);          // smoothstep interpolant
  return mix(mix(mix(hash1(i + vec3(0.0, 0.0, 0.0)), hash1(i + vec3(1.0, 0.0, 0.0)), f.x),
                 mix(hash1(i + vec3(0.0, 1.0, 0.0)), hash1(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(hash1(i + vec3(0.0, 0.0, 1.0)), hash1(i + vec3(1.0, 0.0, 1.0)), f.x),
                 mix(hash1(i + vec3(0.0, 1.0, 1.0)), hash1(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
}

float fbm(vec3 p) {
  float a = 0.5, sum = 0.0, norm = 0.0;
  for (int i = 0; i < 5; i++) {
    sum  += a * noise(p);
    norm += a;
    p    *= 2.02;
    a    *= 0.5;
  }
  return sum / norm;
}

/* Surface height in object space. */
float terrain(vec3 p) { return fbm(p * 2.3); }

/* Gradient of the height field by forward differences. Reusing the centre sample the
   caller already has costs three taps instead of the four a tetrahedral stencil needs. */
vec3 terrainGrad(vec3 p, float centre) {
  float e = 0.0035;
  return vec3(terrain(p + vec3(e, 0.0, 0.0)) - centre,
              terrain(p + vec3(0.0, e, 0.0)) - centre,
              terrain(p + vec3(0.0, 0.0, e)) - centre) / e;
}

/* ---- starfield: one star per cell, centre kept clear of cell walls ---- */
float stars(vec3 rd, float scale, float thresh) {
  vec3 p = rd * scale;
  vec3 i = floor(p), f = fract(p);
  float h = hash1(i);
  if (h < thresh) return 0.0;
  vec3 c = 0.25 + 0.5 * vec3(hash1(i + 1.7), hash1(i + 3.3), hash1(i + 5.1));
  float d = length(f - c);
  return (1.0 - smoothstep(0.0, 0.11, d)) * (h - thresh) / (1.0 - thresh);
}

vec3 background(vec3 rd) {
  vec3 top = vec3(0.011, 0.016, 0.032);
  vec3 bot = vec3(0.003, 0.004, 0.010);
  vec3 col = mix(bot, top, smoothstep(-0.8, 0.9, rd.y));
  col += vec3(0.020, 0.026, 0.048) * pow(max(0.0, 0.55 - abs(rd.y)), 2.0); // faint galactic band
  float s = stars(rd, 130.0, 0.955) * 1.6 + stars(rd, 46.0, 0.988) * 3.2;
  return col + vec3(0.85, 0.90, 1.0) * s;
}

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  /* Normalise by the SHORTER edge so the sphere fits in portrait as well as landscape. */
  float m  = min(uRes.x, uRes.y);
  vec2  uv = (gl_FragCoord.xy - 0.5 * uRes) / m;

  // uv spans [-0.5, 0.5] across the short edge, so the half-extent is 0.5 — not 1.0.
  float focal = 0.5 / tan(radians(40.0) * 0.5);
  mat3 cam = rotY(uYaw) * rotX(uPitch);
  vec3 ro = cam * vec3(0.0, 0.0, uDist);
  vec3 rd = normalize(cam * vec3(uv, -focal));

  vec3 L = normalize(vec3(0.60, 0.42, 0.68));   // key light, fixed in world space

  /* --- exact ray/sphere intersection --- */
  float tca = dot(-ro, rd);                     // distance along ray to closest approach
  float d   = sqrt(max(dot(ro, ro) - tca * tca, 0.0));

  /* Analytic edge coverage: one pixel's world footprint at the closest approach. */
  float pw  = 1.4 * max(tca, 0.0) / (focal * m);
  float cov = (tca > 0.0) ? 1.0 - smoothstep(R - pw, R + pw, d) : 0.0;

  vec3 col = background(rd);

  /* Atmospheric halo: tight to the limb, and brightest where the limb is sunlit. */
  if (tca > 0.0) {
    vec3  limb = normalize(ro + rd * tca);
    float sunAmt = pow(clamp(dot(limb, L) * 0.5 + 0.5, 0.0, 1.0), 2.5);
    float halo = pow(clamp(R / max(d, 1e-4), 0.0, 1.0), 22.0);
    col += mix(vec3(0.10, 0.22, 0.50), vec3(0.45, 0.60, 0.95), sunAmt)
         * halo * (0.10 + 0.90 * sunAmt) * 0.55 * (1.0 - cov);
  }

  if (cov > 0.0) {
    /* Keep the shading ray just inside the limb so the normal stays defined. */
    float ds  = min(d, R * 0.99995);
    float t   = tca - sqrt(R * R - ds * ds);
    vec3  pos = ro + rd * t;
    vec3  N   = normalize(pos);
    vec3  V   = -rd;

    /* The sphere's own frame: spin about its axis, then tilt the axis over. */
    mat3 obj = rotZ(uTilt) * rotY(uPhase);        // object -> world
    mat3 inv = rotY(-uPhase) * rotZ(-uTilt);      // world -> object (rotations, so this is the inverse)
    vec3 po  = inv * pos;

    float h = terrain(po);

    /* Bump: bring the height gradient into world space, keep its tangential part. */
    vec3 g  = obj * terrainGrad(po, h);
    vec3 G  = g - dot(g, N) * N;
    vec3 Nb = normalize(N - 0.055 * G);

    /* Albedo: deep basins, mid shelves, warm highlands, bright poles. */
    vec3 deep = vec3(0.012, 0.031, 0.070);
    vec3 mid  = vec3(0.045, 0.128, 0.170);
    vec3 warm = vec3(0.420, 0.250, 0.105);
    vec3 alb  = mix(deep, mid, smoothstep(0.34, 0.52, h));
    alb       = mix(alb, warm, smoothstep(0.54, 0.74, h));
    float ice = smoothstep(0.78, 0.97, abs(po.y) + 0.18 * h);
    alb       = mix(alb, vec3(0.80, 0.84, 0.90), ice);

    /* Water is smooth and reflective, land is rough. */
    float land  = smoothstep(0.44, 0.56, h);
    float gloss = mix(210.0, 22.0, land);
    float spInt = mix(0.85, 0.10, land) + 0.30 * ice;

    float ndl  = dot(Nb, L);
    float diff = clamp(ndl, 0.0, 1.0);
    float wrap = clamp((ndl + 0.18) / 1.18, 0.0, 1.0);   // softens the terminator

    vec3 H    = normalize(L + V);
    float f0  = 0.03;
    float fres = f0 + (1.0 - f0) * pow(1.0 - clamp(dot(H, V), 0.0, 1.0), 5.0);
    float spec = pow(clamp(dot(Nb, H), 0.0, 1.0), gloss) * step(0.0, ndl) * fres * spInt;

    vec3 sun = vec3(1.00, 0.93, 0.82) * 2.5;
    vec3 sky = vec3(0.055, 0.085, 0.150);                // hemispheric fill
    vec3 lit = alb * (sun * mix(diff, wrap, 0.35) + sky * (0.5 + 0.5 * Nb.y));
    lit += sun * spec * 1.6;

    /* Rim light: cool scatter along the limb, strongest where the sun grazes. */
    float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.5);
    lit += vec3(0.22, 0.42, 0.80) * rim * (0.28 + 0.72 * clamp(ndl + 0.35, 0.0, 1.0));

    col = mix(col, lit, cov);
  }

  col = aces(col);
  col = pow(col, vec3(1.0 / 2.2));                       // linear -> sRGB

  /* A dark gradient across an 8-bit framebuffer bands badly. Dither by less than one
     level before it quantises. The pattern is fixed per pixel, so it never shimmers. */
  col += (hash1(vec3(gl_FragCoord.xy, 0.5)) - 0.5) / 255.0;

  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
  "use strict";

  var canvas   = document.getElementById("gl");
  var hint     = document.getElementById("hint");
  var toggle   = document.getElementById("toggle");
  var fallback = document.getElementById("fallback");

  function fail() {
    canvas.style.display = "none";
    document.getElementById("ui").style.display = "none";
    fallback.classList.add("show");
  }

  var opts = { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: "high-performance" };
  var gl = canvas.getContext("webgl", opts) || canvas.getContext("experimental-webgl", opts);
  if (!gl) { fail(); return; }

  /* ---------------- program ---------------- */

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  var program = null, loc = null, buffer = null;

  function build() {
    var vs = compile(gl.VERTEX_SHADER,   document.getElementById("vs").textContent);
    var fs = compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent);
    if (!vs || !fs) return false;

    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.bindAttribLocation(program, 0, "aPos");
    gl.linkProgram(program);
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(program));
      return false;
    }

    gl.useProgram(program);
    loc = {
      res:   gl.getUniformLocation(program, "uRes"),
      phase: gl.getUniformLocation(program, "uPhase"),
      tilt:  gl.getUniformLocation(program, "uTilt"),
      yaw:   gl.getUniformLocation(program, "uYaw"),
      pitch: gl.getUniformLocation(program, "uPitch"),
      dist:  gl.getUniformLocation(program, "uDist")
    };

    // One oversized triangle covers the viewport with no seam down the diagonal.
    buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    return true;
  }

  if (!build()) { fail(); return; }

  /* ---------------- state ---------------- */

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var coarse  = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

  // The shader frames a 40 degree FOV across the short edge, so the sphere exactly
  // fills the viewport at 1 / sin(20 deg) = 2.92. Closer than that and you are just
  // magnifying noise, so that is where zoom stops.
  var MIN_DIST = 2.95, MAX_DIST = 12.0, MAX_PITCH = Math.PI / 2 - 0.05;

  var SPIN     = reduced ? 0.045 : 0.22;  // rad/s of sphere rotation
  var EASE     = 14.0;                    // camera catch-up rate
  var FRICTION = 3.6;                     // flick decay rate

  var phase = 0, tilt = 0.36, paused = false;

  // Each camera value is a target the user drives, plus a rendered value that chases it.
  // Everything the user touches moves the target, so the view is always eased, never snapped.
  var cam = {
    yaw: 0,    tYaw: 0,    vYaw: 0,
    pitch: .16, tPitch: .16, vPitch: 0,
    dist: 4.2,  tDist: 4.2
  };

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  /* ---------------- sizing ---------------- */

  var width = 0, height = 0;
  var quality = 1.0;   // resolution scale, driven by measured frame time

  function resize() {
    // Cap the pixel ratio: this shader is fill-rate bound, and past 2x the gain is invisible.
    var dpr = Math.min(window.devicePixelRatio || 1, 2) * quality;
    var w = Math.max(1, Math.round(canvas.clientWidth  * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    var max = gl.getParameter(gl.MAX_VIEWPORT_DIMS) || [4096, 4096];
    w = Math.min(w, max[0]);
    h = Math.min(h, max[1]);
    if (w === width && h === height) return;
    width = w; height = h;
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }

  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  window.addEventListener("resize", resize);

  /* Hold the framerate by trading resolution for fill rate. The canvas is stretched back
     to full size by CSS, so dropping scale costs sharpness rather than smoothness. */
  var accTime = 0, accFrames = 0, settle = 1.0;
  var TARGET = 1 / 57;   // aim a little inside a 60Hz budget

  function adapt(dt) {
    if (settle > 0) { settle -= dt; return; }
    accTime += dt; accFrames++;
    if (accFrames < 24) return;
    var avg = accTime / accFrames;
    accTime = 0; accFrames = 0;

    // Dead band: only act on a clear miss, so we don't thrash around the target.
    if (avg < 1 / 48 && avg > 1 / 58) return;
    if (avg <= 1 / 58 && quality >= 1) return;
    if (avg >= 1 / 48 && quality <= 0.6) return;

    // Fill cost scales with pixel count, which scales with quality squared — so aiming at
    // the target takes sqrt of the time ratio. Capped per step to stay stable.
    var factor = Math.sqrt(TARGET / avg);
    factor = clamp(factor, 0.65, 1.3);
    var next = clamp(quality * factor, 0.6, 1.0);

    if (Math.abs(next - quality) > 0.02) {
      quality = next;
      settle = 0.5;      // let the new size take effect before measuring again
      resize();
    }
  }

  /* ---------------- input ---------------- */

  // Live pointers, keyed by pointerId. One down means orbit, two means pinch-zoom.
  // The map is the single source of truth for how many fingers are on the glass.
  var pointers = Object.create(null);
  var dragging = false, lastMoveT = 0;
  var pinchSpan = 0, pinchDist0 = 0;

  function pointerList() {
    var out = [];
    for (var id in pointers) out.push(pointers[id]);
    return out;
  }

  function orbitScale() {
    // Scale by the short edge so a drag feels the same on any screen.
    return 2.6 / Math.max(1, Math.min(canvas.clientWidth, canvas.clientHeight));
  }

  function beginPinch() {
    var p = pointerList();
    if (p.length < 2) return;
    pinchSpan = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
    pinchDist0 = cam.tDist;
  }

  function dismissHint() { hint.classList.add("hidden"); }

  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    dismissHint();

    var n = pointerList().length;
    if (n === 1) {
      dragging = true;
      lastMoveT = performance.now();
      cam.vYaw = cam.vPitch = 0;          // grabbing it kills any spin still in flight
      canvas.classList.add("dragging");
    } else if (n === 2) {
      dragging = false;                   // a second finger switches modes to pinch
      canvas.classList.remove("dragging");
      beginPinch();
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    var list = pointerList();
    if (list.length >= 2) {
      var span = Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y);
      if (span > 0) cam.tDist = clamp(pinchDist0 * (pinchSpan / span), MIN_DIST, MAX_DIST);
      return;
    }
    if (!dragging) return;

    var k = orbitScale();
    cam.tYaw   -= dx * k;
    cam.tPitch  = clamp(cam.tPitch + dy * k, -MAX_PITCH, MAX_PITCH);

    // Track a smoothed velocity so releasing mid-swipe flicks the sphere onward.
    var now = performance.now();
    var dtv = Math.max(8, now - lastMoveT) / 1000;
    lastMoveT = now;
    cam.vYaw   = cam.vYaw   * 0.6 + (-dx * k / dtv) * 0.4;
    cam.vPitch = cam.vPitch * 0.6 + ( dy * k / dtv) * 0.4;
  });

  function release(e) {
    if (!pointers[e.pointerId]) return;
    delete pointers[e.pointerId];
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);

    var list = pointerList();
    if (list.length === 1) {
      // Lifting one finger of a pinch: hand control back to the survivor without a jump.
      dragging = true;
      lastMoveT = performance.now();
      cam.vYaw = cam.vPitch = 0;
      canvas.classList.add("dragging");
    } else if (list.length === 0) {
      // Released after pausing mid-drag? Then it is not a flick.
      if (performance.now() - lastMoveT > 90) { cam.vYaw = 0; cam.vPitch = 0; }
      dragging = false;
      canvas.classList.remove("dragging");
    } else {
      beginPinch();
    }
  }
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    // Normalise line- and page-mode deltas so trackpads and mice agree.
    var unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.clientHeight : 1;
    cam.tDist = clamp(cam.tDist * Math.exp(e.deltaY * unit * 0.0012), MIN_DIST, MAX_DIST);
    dismissHint();
  }, { passive: false });

  /* ---------------- pause control ---------------- */

  function setPaused(v) {
    paused = v;
    toggle.classList.toggle("paused", paused);
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
    toggle.setAttribute("aria-label", paused ? "Resume rotation" : "Pause rotation");
    dismissHint();
  }

  toggle.addEventListener("click", function () { setPaused(!paused); });

  window.addEventListener("keydown", function (e) {
    if (e.code !== "Space" && e.key !== " ") return;
    // The button is a real <button>, so let it handle its own Space press.
    if (document.activeElement === toggle) return;
    e.preventDefault();
    setPaused(!paused);
  });

  if (coarse) hint.textContent = "drag to orbit · pinch to zoom";

  /* ---------------- context loss ---------------- */

  var lost = false;

  canvas.addEventListener("webglcontextlost", function (e) {
    e.preventDefault();
    lost = true;
  });

  canvas.addEventListener("webglcontextrestored", function () {
    width = height = 0;          // force a viewport refresh
    if (build()) { lost = false; resize(); }
    else fail();
  });

  /* ---------------- loop ---------------- */

  var last = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (lost) { last = now; return; }

    // Clamp dt so a backgrounded tab doesn't come back to a huge jump.
    var dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
    last = now;

    resize();
    adapt(dt);

    if (!paused) {
      phase += SPIN * dt;
      if (phase > Math.PI * 2) phase -= Math.PI * 2;   // keep float precision tight
    }

    // Coast after a flick, shedding speed at a fixed rate per second.
    if (!dragging && (cam.vYaw || cam.vPitch)) {
      cam.tYaw   += cam.vYaw * dt;
      cam.tPitch  = clamp(cam.tPitch + cam.vPitch * dt, -MAX_PITCH, MAX_PITCH);
      var decay = Math.exp(-FRICTION * dt);
      cam.vYaw   *= decay;
      cam.vPitch *= decay;
      if (Math.abs(cam.vYaw)   < 1e-4) cam.vYaw = 0;
      if (Math.abs(cam.vPitch) < 1e-4) cam.vPitch = 0;
    }

    // Exponential ease written against dt, so the feel is identical at 60 and 144 Hz.
    var a = 1 - Math.exp(-EASE * dt);
    cam.yaw   += (cam.tYaw   - cam.yaw)   * a;
    cam.pitch += (cam.tPitch - cam.pitch) * a;
    cam.dist  += (cam.tDist  - cam.dist)  * a;

    gl.uniform2f(loc.res, width, height);
    gl.uniform1f(loc.phase, phase);
    gl.uniform1f(loc.tilt,  tilt);
    gl.uniform1f(loc.yaw,   cam.yaw);
    gl.uniform1f(loc.pitch, cam.pitch);
    gl.uniform1f(loc.dist,  cam.dist);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  resize();
  requestAnimationFrame(frame);
  setTimeout(dismissHint, 6000);
})();
</script>
